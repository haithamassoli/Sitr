name: Website
# Builds web/ (Astro) and deploys it to GitHub Pages. Rebuilds on every published release so the
# download button points at the newest DMG. Requires Settings › Pages › Source: GitHub Actions, custom
# domain sitr.assoli.site (DNS: CNAME sitr -> haithamassoli.github.io).
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4

name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Assemble app
        run: scripts/build-app.sh --debug
      - name: Entitlements gate (sandbox on, no network)
        run: scripts/check-entitlements.sh build/Sitr.app

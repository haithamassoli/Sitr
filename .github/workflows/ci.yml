name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Bench smoke (sitr-bench on 20 Commons faces)
        # Network trouble must not fail CI: the downloader skips files that fail (20 s each) and the step exits 0 when none
        # arrived. With images on disk the bench must process them: it exits 1 when it crashes or processes 0 images.
        run: |
          python3 Bench/download.py --labels Bench/labels/faces-commons.json --limit 20 --timeout 20 || true
          if [ -z "$(find Bench/data/faces -type f 2>/dev/null)" ]; then
            echo "::notice::bench smoke skipped (network)"
            exit 0
          fi
          swift run sitr-bench --selfcheck
          swift run sitr-bench Bench/labels/faces-commons.json --limit 20
      - name: Assemble app
        run: scripts/build-app.sh --debug
      - name: Entitlements gate (sandbox on, no network)
        run: scripts/check-entitlements.sh build/Sitr.app

name: Release
# Tag v* (or run manually with a version) -> tests, signed + notarized build, DMG, draft GitHub release.
# Without the signing/notary secrets (forks, dry runs) the build is ad-hoc signed, notarization is skipped with a
# log line, and the draft is titled "(unsigned)". Secrets: DEVELOPER_ID_P12 (base64 .p12), DEVELOPER_ID_P12_PASSWORD,
# NOTARY_KEY_ID, NOTARY_ISSUER, NOTARY_KEY_P8 (App Store Connect API key, .p8 contents). See docs/m5/release.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.1.0 (release tag will be v<version>)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          # shellcheck disable=SC2012  # same line as ci.yml; ls -d on a fixed glob is fine here
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Version from tag or input
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"
      - name: Unit tests
        run: swift test
      - name: Import Developer ID certificate and notary key
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -z "$P12" ]; then
            echo "::notice::No DEVELOPER_ID_P12 secret: ad-hoc signing, notarization skipped (unsigned draft release)."
            echo "SIGN_ID=-" >> "$GITHUB_ENV"; exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/release.keychain-db; KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Apple's Developer ID intermediate, in case the .p12 was exported without its chain.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -A || echo "::warning::could not import Developer ID G2 intermediate"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$SIGN_ID" ] || { echo "::error::no Developer ID Application identity in the imported .p12"; exit 1; }
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build, sign, notarize, staple (dry run when SIGN_ID is ad-hoc)
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/release.sh
      - name: DMG + checksums
        run: scripts/make-dmg.sh
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="[$VERSION]" '/^## /{p = index($0, v) == 4; next} p' CHANGELOG.md > build/notes.md
          if ! grep -q '[^[:space:]]' build/notes.md; then
            echo "::warning::CHANGELOG.md has no [$VERSION] section"
            echo "No CHANGELOG.md section for $VERSION yet." > build/notes.md
          fi
          if [ "$SIGN_ID" = "-" ]; then
            { echo "> **Unsigned build**: produced without Developer ID / notarization secrets. Not for distribution."; echo; cat build/notes.md; } > build/notes.tmp
            mv build/notes.tmp build/notes.md
          fi
          cat build/notes.md
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$VERSION; TITLE="Sitr $VERSION"; [ "$SIGN_ID" = "-" ] && TITLE="$TITLE (unsigned)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "$TITLE" --notes-file build/notes.md
            gh release upload "$TAG" --clobber "build/Sitr-$VERSION.dmg" build/checksums.txt
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes-file build/notes.md \
              "build/Sitr-$VERSION.dmg" build/checksums.txt
          fi
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
